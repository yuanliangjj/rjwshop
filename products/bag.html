<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>Shoulder Bags — My Picks</title>

  <style>

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: #faf9f7;
      color: #333;
      font-family: Arial, Helvetica, sans-serif;
      padding: 20px 16px 50px;
    }

    .container {
      max-width: 700px;
      margin: auto;
    }

    /* BACK */

    .back {
      display: inline-block;
      margin-bottom: 30px;
      font-size: 12px;
      color: #888;
      text-decoration: none;
    }

    /* TITLE */

    .title {
      margin-bottom: 30px;
    }

    .title h1 {
      font-size: 25px;
      font-weight: 500;
      margin-bottom: 7px;
    }

    .title p {
      font-size: 12px;
      color: #999;
    }

    /* PRODUCT LIST */

    .products {
      display: flex;
      flex-direction: column;
      gap: 28px;
    }

    .product {
      background: white;
      border-radius: 15px;
      overflow: hidden;
    }

    .product-image {
      width: 100%;
      display: block;
      aspect-ratio: 1 / 1;
      object-fit: cover;
    }

    .product-info {
      padding: 15px;
    }

    .product-name {
      font-size: 14px;
      font-weight: 500;
      margin-bottom: 10px;
    }

    /* PRICE */

    .price-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .price {
      font-size: 15px;
      color: #555;
    }

    .price.cheapest {
      font-weight: 700;
      color: #222;
    }

    .cheapest-label {
      font-size: 9px;
      margin-left: 5px;
      letter-spacing: 0.5px;
    }

    /* SHOPEE BUTTON */

    .shopee {
      background: #333;
      color: white;
      text-decoration: none;
      padding: 9px 13px;
      border-radius: 20px;
      font-size: 10px;
      white-space: nowrap;
    }

    /* FOOTER */

    footer {
      text-align: center;
      margin-top: 50px;
    }

    footer p {
      font-size: 10px;
      color: #aaa;
    }

  </style>

</head>


<body>


<div class="container">


  <!-- BACK -->

  <a href="../index.html" class="back">
    ← Back to My Picks
  </a>


  <!-- TITLE -->

  <div class="title">

    <h1>Shoulder Bags</h1>

    <p>
      comparing before I buy ♡
    </p>

  </div>


  <!-- PRODUCTS -->

  <div class="products">


    <!-- PRODUCT 1 -->

    <div class="product">

      <img
        class="product-image"
        src="https://images.unsplash.com/photo-1553062407-98eeb64c6a62?w=1000"
        alt="Black Shoulder Bag"
      >

      <div class="product-info">

        <div class="product-name">
          Black Shoulder Bag
        </div>

        <div class="price-row">

          <div class="price">
            Rp129.000
          </div>

          <a
            href="https://shopee.co.id/"
            target="_blank"
            class="shopee"
          >
            SHOPEE →
          </a>

        </div>

      </div>

    </div>



    <!-- PRODUCT 2 -->

    <div class="product">

      <img
        class="product-image"
        src="https://images.unsplash.com/photo-1594223274512-ad4803739b7c?w=1000"
        alt="Mini Shoulder Bag"
      >

      <div class="product-info">

        <div class="product-name">
          Mini Shoulder Bag
        </div>

        <div class="price-row">

          <div class="price">
            Rp99.000
          </div>

          <a
            href="https://shopee.co.id/"
            target="_blank"
            class="shopee"
          >
            SHOPEE →
          </a>

        </div>

      </div>

    </div>



    <!-- PRODUCT 3 -->

    <div class="product">

      <img
        class="product-image"
        src="https://images.unsplash.com/photo-1584917865442-de89df76afd3?w=1000"
        alt="Vintage Shoulder Bag"
      >

      <div class="product-info">

        <div class="product-name">
          Vintage Shoulder Bag
        </div>

        <div class="price-row">

          <div class="price">
            Rp149.000
          </div>

          <a
            href="https://shopee.co.id/"
            target="_blank"
            class="shopee"
          >
            SHOPEE →
          </a>

        </div>

      </div>

    </div>


  </div>


  <footer>

    <p>
      ♡ compare first, buy later
    </p>

  </footer>


</div>


<script>

  /*
    AUTOMATICALLY FIND
    THE CHEAPEST PRICE
  */

  const prices = document.querySelectorAll(".price");

  let cheapest = null;
  let cheapestValue = Infinity;


  prices.forEach(function(price) {

    const number = parseInt(
      price.innerText
        .replace(/[^0-9]/g, "")
    );

    if (number < cheapestValue) {

      cheapestValue = number;
      cheapest = price;

    }

  });


  if (cheapest) {

    cheapest.classList.add("cheapest");

    cheapest.innerHTML +=
      '<span class="cheapest-label">CHEAPEST ♡</span>';

  }

</script>


</body>

</html>
